<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake WhatsApp Chat Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Panel Kontrol (Kiri) -->
        <div class="control-panel">
            <h1>🛠️ Fake WhatsApp Generator</h1>
            
            <section class="control-section" style="background: #242446; border: 1px solid #A18DFD;">
                <h2>🤖 Panduan Khusus AI</h2>
                <button id="open-guide-btn" class="primary-btn" style="background: #A18DFD; color: #fff;">Lihat Panduan Sistem (Markdown)</button>
            </section>

            <section class="control-section">
                <h2>1. Profil Kontak</h2>
                <div class="form-group">
                    <label>Foto Profil (Opsional):</label>
                    <input type="file" id="profile-upload" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Nama Kontak:</label>
                    <input type="text" id="contact-name-input" value="Sayang">
                </div>
                <div class="form-group">
                    <label>Status Aktivitas:</label>
                    <input type="text" id="contact-status-input" value="Online">
                </div>
                <div class="form-group">
                    <label>Tema Warna Avatar:</label>
                    <div id="avatar-color-picker" class="color-picker-container">
                        <div class="color-btn selected" data-idx="0" style="background:#103629; color:#2CD46E;">A</div>
                        <div class="color-btn" data-idx="1" style="background:#242446; color:#A18DFD;">A</div>
                        <div class="color-btn" data-idx="2" style="background:#082C3C; color:#52BEE8;">A</div>
                        <div class="color-btn" data-idx="3" style="background:#34271F; color:#C89E80;">A</div>
                        <div class="color-btn" data-idx="4" style="background:#311624; color:#F2A7B4;">A</div>
                    </div>
                </div>
            </section>

            <section class="control-section">
                <h2>2. Percakapan (Timeline)</h2>
                <div id="messages-control-list">
                    <!-- Dynamic message controls will be inserted here -->
                </div>
                
                <div class="add-buttons">
                    <button id="add-date-btn" style="flex-basis: 100%;">🗓 Tanggal</button>
                    
                    <button id="add-incoming-btn">↙️ Teks Masuk</button>
                    <button id="add-outgoing-btn">↗️ Teks Keluar</button>
                    
                    <button id="add-del-in-btn" style="background:#cc0000;">🗑️ Masuk (Dihapus)</button>
                    <button id="add-del-out-btn" style="background:#cc0000;">🗑️ Keluar (Dihapus)</button>
                </div>
            </section>

            <section class="control-section">
                <h2>3. Ekspor</h2>
                <button id="export-btn" class="primary-btn">📸 Unduh Gambar (PNG)</button>
            </section>
        </div>

        <!-- Live Preview (Kanan) -->
        <div class="preview-panel">
            <div id="live-preview-container" class="whatsapp-preview">
                <!-- Header WhatsApp -->
                <div class="wa-header">
                    <div class="wa-header-left">
                        <!-- Back Arrow -->
                        <svg viewBox="0 0 24 24" class="wa-back-icon" fill="currentColor">
                            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" transform="rotate(180 12 12)"/>
                        </svg>
                        <div class="wa-avatar">
                            <img id="wa-avatar-img" style="display:none;" />
                            <div id="wa-avatar-fallback">S</div>
                        </div>
                        <div class="wa-contact-info">
                            <div class="wa-contact-name" id="wa-contact-name">Sayang</div>
                            <div class="wa-contact-status" id="wa-contact-status"></div>
                        </div>
                    </div>
                    <div class="wa-header-right">
                        <!-- Video Call -->
                        <svg viewBox="0 0 24 24" class="wa-icon" style="width: 26px; height: 26px;" preserveAspectRatio="xMidYMid meet" fill="currentColor">
                            <title>ic-videocam</title>
                            <path fill="currentColor" d="M4 20c-.55 0-1.02-.2-1.41-.59-.4-.39-.59-.86-.59-1.41V6c0-.55.2-1.02.59-1.41C2.98 4.19 3.45 4 4 4h12c.55 0 1.02.2 1.41.59.4.39.59.86.59 1.41v4.5l3.15-3.15c.17-.17.35-.2.55-.13.2.09.3.25.3.48v8.6c0 .23-.1.4-.3.47-.2.09-.38.05-.55-.12L18 13.5V18c0 .55-.2 1.02-.59 1.41-.39.4-.86.59-1.41.59H4Zm0-2h12V6H4v12Z"></path>
                        </svg>
                        <!-- Phone Call -->
                        <svg viewBox="0 0 24 24" class="wa-icon" fill="currentColor">
                            <path d="M6.54 5c.06.89.21 1.76.45 2.59l-1.2 1.2c-.41-1.2-.67-2.47-.76-3.79h1.51m9.86 12.02c.85.24 1.72.39 2.6.45v1.49c-1.32-.09-2.59-.35-3.8-.75l1.2-1.19M7.5 3H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.49c0-.55-.45-1-1-1-1.24 0-2.45-.2-3.57-.57-.32-.11-.74-.03-1.02.25l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.2c.28-.28.36-.67.25-1.02C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1z"/>
                        </svg>
                        <!-- Vertical Dots Menu -->
                        <svg viewBox="0 0 24 24" class="wa-icon" fill="currentColor">
                            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </div>
                </div>

                <!-- Chat Body -->
                <div class="wa-chat-body" id="wa-chat-body">
                    <!-- Messages will be injected here -->
                </div>

                <!-- Input Bar (Bottom) -->
                <div class="wa-input-bar">
                    <img src="pure-input.png" alt="Input Bar" class="wa-input-image">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Panduan AI -->
    <div id="ai-guide-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Panduan Penggunaan AI Agent</h2>
                <button id="close-guide-btn" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="ai-guide-markdown" class="markdown-container"></pre>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
